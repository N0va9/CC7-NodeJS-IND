components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: MongoDB Resource ID
      schema:
        type: string
        example: "6abbd336832a9500aba377e2"
    Code:
      name: code
      in: path
      required: true
      description: Country code
      schema:
        type: string
        example: "AF"
  schemas:
# ARTISTS
    CreateArtistInput:
      type: object
      required:
        - firstName
        - lastName 
        - birthYear
      properties:
        firstName:
          type: string
          minLength: 2
          example: "James"
        lastName:
          type: string
          minLength: 2
          example: "Cameron"
        birthYear:
          type: integer
          format: int32
          minimum: 1900
          maximum: 2100
          example: 1954
        movieId:
          description: The movie ID directed by the artist (optional)
          type: string
          example: "6abf9cc61fea465d82e005b8"
      
    UpdateArtistInput:
      type: object
      required:
        - firstName
        - lastName 
        - birthYear
      properties:
        firstName:
          type: string
          minLength: 2
          example: "James"
        lastName:
          type: string
          minLength: 2
          example: "Cameron"
        birthYear:
          type: integer
          format: int32
          minimum: 1900
          maximum: 2100
          example: 1954
        movieId:
          description: The movie ID directed by the artist (optional)
          type: string
          example: "6abf9cc61fea465d82e005b8"
    
# COUNTRIES
    CreateCountryInput:
      type: object
      required:
        - _id
        - name
        - languages
      properties:
        _id:
          type: string
          minLength: 2
          example: "AF"
        name:
          type: string
          minLength: 2
          example: "Afghanistan"
        languages:
          type: string
          minLength: 2
          example: "Dari, Pashto, Turkmen"

      
    UpdateCountryInput:
      type: object
      required:
        - _id
        - name
        - languages
      properties:
        _id:
          type: string
          minLength: 2
          example: "AF"
        name:
          type: string
          minLength: 2
          example: "Afghanistan"
        languages:
          type: string
          minLength: 2
          example: "Dari, Pashto, Turkmen"
    
# MOVIES
    CreateMovieInput:
      type: object
      required:
        - title
        - year 
        - genre
        - resume
        - country
