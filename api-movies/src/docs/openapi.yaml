openapi: 3.0.3

info:
  title: Movies API
  version: 1.0.0
  description: API documentation using Swagger for movies API
  
tags:
  - name: Artists
    description: Artists management

  - name: Countries
    description: Countries management

  - name: Movies
    description: Movies management
  
  - name: Netizens
    description: Netizens management

  
# ARTISTS
paths:
  /api-movies/artists:
    get: 
      tags:
        - Artists
      summary: Retrieve all artists
      operationId: getArtists
      responses: 
        "200":
          description: All artists has been retrived  
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    
    post: 
      tags:
        - Artists
      summary: Create an artist
      operationId: createArtist
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/CreateArtistInput"
      responses: 
        "201":
          description: The artist has been created  
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400": 
          $ref: "#/components/responses/BadRequest"

        "409": 
          $ref: "#/components/responses/Conflict"
        
        "500": 
          $ref: "#/components/responses/InternalServerError"

  /api-movies/artists/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get: 
      tags:
      - Artists
      summary: Get an artist by his ID
      operationId: getArtistById
      responses: 
        "200":
          description: The artist was found   
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400": 
          $ref: "#/components/responses/BadRequest"

        "404": 
          $ref: "#/components/responses/ResourceNotFound"
        
        "500": 
          $ref: "#/components/responses/InternalServerError"
    
    patch: 
      tags: 
        - Artists
      summary: Update an artist 
      operationId: updateArtist
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              $ref: "#/components/schemas/UpdateArtistInput"
      responses: 
        "200":
          description: Artist updated   
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400": 
          $ref: "#/components/responses/BadRequest"

        "404": 
          $ref: "#/components/responses/ResourceNotFound"
        
        "409": 
          $ref: "#/components/responses/Conflict"
        
        "500": 
          $ref: "#/components/responses/InternalServerError"

    delete: 
      tags: 
        - Artists
      summary: Delete an artist 
      operationId: deleteArtist
      responses: 
        "204":
          description: Artist deleted   

        "400": 
          $ref: "#/components/responses/BadRequest"

        "404": 
          $ref: "#/components/responses/ResourceNotFound"
        
        "500": 
          $ref: "#/components/responses/InternalServerError"
    
