    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          example: 404
        
        code:
          string: string
          example: RESOURCE_NOT_FOUND

        message:
          type: string
          example: Resource not found
  
  responses:
    BadRequest:
      description: Invalid request
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 400
            code: VALIDATION_ERROR
            message: Invalid data

    ResourceNotFound:
      description: Resource not found
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 404
            code: RESOURCE_NOT_FOUND
            message: Resource not found


    Unauthorized:
      description: Unauthorized access
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 401
            code: UNAUTHORIZED_ACCESS
            message: Authentification required

    Forbidden:
      description: Forbidden access
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 403
            code: FORBIDDEN_ACCESS
            message: You don't have the right to access at this resource

    Conflict:
      description: Invalid request
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 409
            code: DUPLICATE_KEY
            message: Resource with same value already exists
    
    InternalServerError:
      description: Internal server error
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 500
            code: INTERNAL_ERROR
            message: Internal server error

