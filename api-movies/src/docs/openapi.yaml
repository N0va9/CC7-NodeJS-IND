components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: MongoDB Resource ID
      schema:
        type: string
        example: "6abbd336832a9500aba377e2"
  schemas:
    CreateArtistInput:
      type: object
      required:
        - firstName
        - lastName 
        - birthYear
      properties:
        firstName:
          type: string
          minLength: 2
          example: "James"
        lastName:
          type: string
          minLength: 2
          example: "Cameron"
        birthYear:
          type: Number
          minLength: 2
          example: 1954
      
    UpdateArtistInput:
      type: object
      required:
        - firstName
        - lastName 
        - birthYear
      properties:
        firstName:
          type: string
          minLength: 2
          example: "James"
        lastName:
          type: string
          minLength: 2
          example: "Cameron"
        birthYear:
          type: Number
          minLength: 2
          example: 1954
    
    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          example: 404
        
        code:
          string: string
          example: RESOURCE_NOT_FOUND

        message:
          type: string
          example: Resource not found
  
  responses:
    BadRequest:
      description: Invalid request
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 400
            code: VALIDATION_ERROR
            message: Invalid data

    ResourceNotFound:
      description: Resource not found
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 404
            code: RESOURCE_NOT_FOUND
            message: Resource not found

    Conflict:
      description: Invalid request
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 409
            code: DUPLICATE_KEY
            message: Resource with same value already exists
    
    InternalServerError:
      description: Internal server error
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

          example: 
            status: 500
            code: INTERNAL_ERROR
            message: Internal server error

